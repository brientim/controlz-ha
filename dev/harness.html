<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ControlZ HA — harness</title>
  <style>
    :root {
      --primary-background-color: #f4f5f7;
      --card-background-color: #fff;
      --primary-text-color: #111827;
      --secondary-text-color: #6b7280;
      --divider-color: #e5e7eb;
    }
    html.dark {
      --primary-background-color: #111111;
      --card-background-color: #1c1c1c;
      --secondary-background-color: #262626;
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b;
      --divider-color: rgba(225,225,225,0.12);
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--primary-background-color); color: var(--primary-text-color); }
    header { position: sticky; top: 0; z-index: 5; background: #03a9f4; color: #fff; }
    .bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-wrap: wrap; }
    .bar h1 { font-size: 1.1rem; margin: 0 12px 0 0; }
    .tabs { display: flex; overflow-x: auto; padding: 0 8px; }
    .tabs a { color: rgba(255,255,255,0.8); text-decoration: none; padding: 10px 14px; font-size: 0.9rem; white-space: nowrap; border-bottom: 2px solid transparent; }
    .tabs a.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }
    select, button { font: inherit; }
    #log { position: fixed; right: 8px; bottom: 8px; max-width: 420px; max-height: 30vh; overflow: auto; font: 11px ui-monospace, monospace; background: rgba(17,24,39,0.88); color: #d1fae5; padding: 8px; border-radius: 8px; z-index: 20; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>ControlZ</h1>
      <label>Tile size
        <select id="size"><option>large</option><option>thin</option><option>compact</option></select>
      </label>
      <label><input type="checkbox" id="dark" /> Dark theme</label>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
  <div id="log"></div>

  <script>
    window.__errors = [];
    window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
    window.addEventListener("unhandledrejection", (e) => window.__errors.push(String(e.reason?.stack || e.reason)));
  </script>
  <script type="module">
    import "../dist/controlz-ha.js";
    import { createMockHass } from "./mock-hass.js";

    window.confirm = () => true;
    if (new URLSearchParams(location.search).has("fit")) localStorage.removeItem("controlz-ha.prefs");
    else if (new URLSearchParams(location.search).has("prefs")) {
      localStorage.setItem("controlz-ha.prefs", new URLSearchParams(location.search).get("prefs"));
      window.dispatchEvent(new CustomEvent("controlz-ha-prefs"));
    }
    else if (new URLSearchParams(location.search).has("fresh")) localStorage.removeItem("controlz-ha.prefs");
    if (new URLSearchParams(location.search).has("fresh")) {
      for (const key of ["controlz-harness-dashboard", "controlz-harness-user-data", "controlz-harness-automations", "controlz-harness-scenes", "controlz-harness-scripts", "controlz-harness-todos"]) sessionStorage.removeItem(key);
    }
    const log = document.getElementById("log");
    const print = (msg) => { log.textContent = `${msg}\n${log.textContent}`.slice(0, 4000); };

    let cards = [];
    const mock = createMockHass((hass, calls) => {
      const c = calls[calls.length - 1];
      print(`${c.domain}.${c.service} ${JSON.stringify(c.data)}`);
      for (const card of cards) card.hass = hass;
    });
    window.__mock = mock;

    document.addEventListener("hass-more-info", (e) => print(`more-info ${e.detail.entityId}`));

    const params = new URLSearchParams(location.search);
    const sizeSelect = document.getElementById("size");
    sizeSelect.value = params.get("size") || "large";
    const dark = document.getElementById("dark");
    dark.checked = params.get("dark") === "1";
    document.documentElement.classList.toggle("dark", dark.checked);

    const Strategy = customElements.get("ll-strategy-dashboard-controlz-rooms");
    // `&roomsizes=garage:compact,office:thin` sets room_tile_sizes for the session.
    const roomSizes = params.get("roomsizes")
      ? { room_tile_sizes: Object.fromEntries(params.get("roomsizes").split(",").map((pair) => pair.split(":"))) }
      : {};
    let dashboard;

    function currentPath() {
      const seg = location.pathname.split("/").pop();
      return dashboard?.views.some((v) => v.path === seg) ? seg : "rooms";
    }

    function renderView(_event, forcedPath) {
      const path = forcedPath || currentPath();
      const view = dashboard.views.find((v) => v.path === path) || dashboard.views[0];
      document.getElementById("tabs").innerHTML = dashboard.views
        .map((v) => `<a href="#" data-path="${v.path}" class="${v === view ? "active" : ""}">${v.title}</a>`)
        .join("");
      const main = document.getElementById("view");
      main.replaceChildren();
      cards = view.cards.map((cfg) => {
        const el = document.createElement(cfg.type.replace("custom:", ""));
        el.setConfig(cfg);
        el.hass = mock.hass;
        main.append(el);
        return el;
      });
    }

    async function regenerate() {
      const saved = JSON.parse(sessionStorage.getItem("controlz-harness-dashboard") || "{}").strategy || {};
      dashboard = await Strategy.generate({
        type: "custom:controlz-rooms", icons_view: true, ...saved, ...roomSizes,
        ...(params.get("banner") ? { security_banner: params.get("banner") } : {}),
        tile_size: sizeSelect.value, room_nav: params.get("nav") || "tabs", tile_scale: Number(params.get("scale") || 1),
      }, mock.hass);
      renderView();
    }

    const base = location.pathname.split("/").slice(0, 2).join("/");
    document.getElementById("tabs").addEventListener("click", (e) => {
      const a = e.target.closest("a[data-path]");
      if (!a) return;
      e.preventDefault();
      const p = a.dataset.path;
      history.pushState(null, "", p === "rooms" ? `${base}/harness.html${location.search}` : `${base}/${p}${location.search}`);
      renderView();
    });
    window.addEventListener("location-changed", renderView);
    window.addEventListener("popstate", renderView);
    sizeSelect.addEventListener("change", regenerate);
    dark.addEventListener("change", () => document.documentElement.classList.toggle("dark", dark.checked));

    /** Every tile in every view at every size: exact contract height, nothing clipped or overflowing. */
    const CONTRACT = { large: 200, thin: 100, compact: 150 };
    const SCALE = Number(params.get("scale") || 1);
    const deepTiles = (root, out = []) => {
      for (const el of root.querySelectorAll("*")) {
        if (el.shadowRoot) {
          const tile = [...el.shadowRoot.children].find((c) => c.matches("article.tile"));
          if (tile) out.push({ host: el, tile });
          deepTiles(el.shadowRoot, out);
        }
      }
      return out;
    };
    window.__fitReport = async () => {
      const problems = [];
      let checked = 0;
      for (const size of Object.keys(CONTRACT)) {
        sizeSelect.value = size;
        dashboard = await Strategy.generate({
          type: "custom:controlz-rooms", tile_size: size, room_nav: params.get("nav") || "tabs", tile_scale: SCALE, ...roomSizes,
        }, mock.hass);
        for (const view of dashboard.views) {
          renderView(null, view.path);
          await new Promise((r) => setTimeout(r, 30));
          const app = document.querySelector("controlz-rooms-app");
          if (!app) { await measure(view.path); continue; }
          for (const item of [...app.shadowRoot.querySelectorAll(".room-item")]) {
            item.click();
            await new Promise((r) => setTimeout(r, 30));
            await measure(`sidebar:${item.dataset.area}`);
          }
        }
        async function measure(where) {
          // Home Assistant's hui-card hides any card whose `hidden` property is truthy.
          for (const card of document.getElementById("view").children) {
            if (card.hidden) problems.push(`${size} ${where} ${card.localName}: card.hidden is truthy, Home Assistant would hide it`);
          }
          for (const { host, tile } of deepTiles(document.getElementById("view"))) {
            checked += 1;
            const id = `${size} ${where} ${host.localName.replace("controlz-", "")} ${host._config.entity || host._config.area}`;
            const h = tile.getBoundingClientRect().height;
            const want = CONTRACT[host.getAttribute("size") || size] * SCALE;
            if (Math.abs(h - want) > 1) problems.push(`${id}: height ${Math.round(h)} != ${want}`);
            const right = tile.getBoundingClientRect().right;
            if (right > document.documentElement.clientWidth + 1) problems.push(`${id}: off-screen right (${Math.round(right)} > ${document.documentElement.clientWidth})`);
            if (tile.scrollHeight > tile.clientHeight + 1) problems.push(`${id}: clipped vertically (${tile.scrollHeight} > ${tile.clientHeight})`);
            for (const row of tile.querySelectorAll(".row, .footer, .header")) {
              if (row.scrollWidth > row.clientWidth + 1) problems.push(`${id}: ${row.className} overflows (${row.scrollWidth} > ${row.clientWidth})`);
            }
            const name = tile.querySelector(".name");
            if (name && name.getBoundingClientRect().width < 48 * SCALE) problems.push(`${id}: name squeezed to ${Math.round(name.getBoundingClientRect().width)}px`);
          }
        }
      }
      return { viewport: innerWidth, checked, problems };
    };

    const initial = params.get("view");
    if (initial) history.replaceState(null, "", `${base}/${initial}${location.search}`);
    const deepFind = (sel, root = document) => {
      const hit = root.querySelector(sel);
      if (hit) return hit;
      for (const el of root.querySelectorAll("*")) {
        if (el.shadowRoot) { const r = deepFind(sel, el.shadowRoot); if (r) return r; }
      }
      return null;
    };
    regenerate().then(async () => {
      if (params.get("run")) {
        const id = params.get("run");
        await mock.hass.callService(id.split(".")[0], "turn_on", { entity_id: id });
      }
      const open = params.get("open");
      if (open) {
        await new Promise((r) => setTimeout(r, 50));
        if (open === "menu") deepFind("controlz-view-menu").shadowRoot.querySelector("[data-toggle]").click();
        if (open === "security") deepFind("[data-banner]").click();
        if (open === "edit") {
          deepFind("controlz-view-menu").shadowRoot.querySelector("[data-toggle]").click();
          await new Promise((r) => setTimeout(r, 30));
          deepFind("controlz-view-menu").shadowRoot.querySelector("[data-edit]").click();
          await new Promise((r) => setTimeout(r, 50));
          if (params.get("hide")) {
            for (const id of params.get("hide").split(",")) {
              deepFind(`.hide-toggle[data-hide-id="${id}"], .ri-eye[data-area="${id}"]`)?.click();
              await new Promise((r) => setTimeout(r, 60));
            }
          }
        }
        if (open === "light-sheet") deepFind("controlz-light-tile .color-btn, .color-btn[data-action=color]").click();
        if (open === "room-sheet") deepFind("[data-action=sheet-open]").click();
        if (open === "maintenance") deepFind("[data-maintenance]").click();
        if (open === "room-history-sheet") deepFind("[data-room-history]").click();
        if (open === "announce-sheet") deepFind("[data-announce]").click();
        if (open === "script-sheet") {
          deepFind('.chip[data-entity="script.good_morning"]').dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, composed: true, cancelable: true }));
          await new Promise((r) => setTimeout(r, 400));
        }
        if (open === "preset-sheet") {
          deepFind("[data-new-preset]").click();
          await new Promise((r) => setTimeout(r, 60));
          const root = () => document.querySelector("controlz-sheet").shadowRoot;
          const set = async (sel, value) => {
            const el = root().querySelector(sel);
            el.value = value;
            for (const type of ["input", "change"]) el.dispatchEvent(new Event(type, { bubbles: true, composed: true }));
            await new Promise((r) => setTimeout(r, 60));
          };
          await set("[data-field=alias]", "Bedtime");
          await set("[data-field=icon]", "mdi:bed");
          await set('[data-field="actions.0.entity_id"]', "scene.office_relax");
          root().querySelector('[data-action=pr-add][data-kind=delay]').click();
          await new Promise((r) => setTimeout(r, 60));
          root().querySelector('[data-action=ed-add-action]').click();
          await new Promise((r) => setTimeout(r, 60));
          root().querySelector('[data-action=ed-action][data-kind=room][data-index="2"]').click();
          await new Promise((r) => setTimeout(r, 60));
          await set('[data-field="actions.2.area_id"]', "living_room");
          await set('[data-field="actions.2.service"]', "turn_off");
          root().querySelector("[data-field=alias]").blur();
          await new Promise((r) => setTimeout(r, 200));
          if (params.get("save") === "1") {
            root().querySelector("[data-action=ed-save]").click();
            await new Promise((r) => setTimeout(r, 1200));
          } else root().querySelector(".sheet-body").scrollTop = 9999;
        }
        if (open === "scene-capture-sheet") {
          deepFind("[data-new-scene]").click();
          await new Promise((r) => setTimeout(r, 60));
          const name = document.querySelector("controlz-sheet").shadowRoot.querySelector("[data-action=cap-name]");
          name.value = "Office Evening";
          name.dispatchEvent(new Event("input", { bubbles: true, composed: true }));
          name.blur();
          if (params.get("save") === "1") {
            await new Promise((r) => setTimeout(r, 30));
            document.querySelector("controlz-sheet").shadowRoot.querySelector("[data-action=cap-save]").click();
            await new Promise((r) => setTimeout(r, 1200));
          }
        }
        if (open === "security-history-sheet") {
          deepFind("[data-banner]").click();
          await new Promise((r) => setTimeout(r, 30));
          document.querySelector("controlz-sheet").shadowRoot.querySelector("[data-action=sec-history]").click();
        }
        if (open.endsWith("history-sheet")) await new Promise((r) => setTimeout(r, 300));
        const tileSheet = {
          "climate-sheet": "climate.", "fan-sheet": "fan.", "alarm-sheet": "alarm_control_panel.", "automation-sheet": "automation.",
          "sensor-history-sheet": params.get("entity") || "sensor.", "lock-sheet": "lock.", "media-sheet": "media_player.",
        }[open];
        if (tileSheet) {
          const deepAll = (root = document, out = []) => {
            for (const el of root.querySelectorAll("*")) {
              if (el._config?.entity) out.push(el);
              if (el.shadowRoot) deepAll(el.shadowRoot, out);
            }
            return out;
          };
          deepAll().find((t) => t._config.entity.startsWith(tileSheet) && t.onTileClick)?.onTileClick();
          await new Promise((r) => setTimeout(r, 300));
        }
        const sheetRoot = () => document.querySelector("controlz-sheet")?.shadowRoot;
        const setField = async (selector, value) => {
          const el = sheetRoot().querySelector(selector);
          el.value = value;
          for (const type of ["input", "change"]) el.dispatchEvent(new Event(type, { bubbles: true, composed: true }));
          await new Promise((r) => setTimeout(r, 60));
        };
        if (open === "editor-sheet") {
          deepFind("[data-new-automation]").click();
          await new Promise((r) => setTimeout(r, 100));
          if (params.get("fill") === "1") {
            await setField("[data-field=alias]", "Leave the office");
            sheetRoot().querySelector('[data-action=ed-action][data-kind=room]').click();
            await new Promise((r) => setTimeout(r, 60));
            await setField('[data-field="actions.0.area_id"]', "office");
            await setField('[data-field="actions.0.service"]', "turn_off");
            sheetRoot().querySelector("[data-action=ed-add-action]").click();
            await new Promise((r) => setTimeout(r, 60));
            await setField('[data-field="actions.1.entity_id"]', "lock.front_door");
            sheetRoot().querySelector("[data-field=alias]").blur();
            await new Promise((r) => setTimeout(r, 300));
            sheetRoot().querySelector(".sheet-body").scrollTop = 9999;
          }
          if (params.get("fill") === "2") {
            const click = async (sel) => { sheetRoot().querySelector(sel).click(); await new Promise((r) => setTimeout(r, 60)); };
            await setField("[data-field=alias]", "Arrive home");
            await click("[data-action=ed-trigger][data-kind=zone]");
            await setField("[data-field='trigger.person']", "person.tim");
            await click("[data-action=ed-action][data-kind=notify]");
            await setField('[data-field="actions.0.service"]', "mobile_app_tims_phone");
            await setField('[data-field="actions.0.message"]', "Welcome home");
            await click("[data-action=ed-add-action]");
            await click('[data-action=ed-action][data-kind=delay][data-index="1"]');
            await click("[data-action=ed-add-action]");
            await click('[data-action=ed-action][data-kind=announce][data-index="2"]');
            await setField('[data-field="actions.2.player"]', "media_player.kitchen_speaker");
            await setField('[data-field="actions.2.entity_id"]', "tts.google_translate_en_com");
            await setField('[data-field="actions.2.message"]', "Tim is home");
            sheetRoot().querySelector("[data-field=alias]").blur();
            await new Promise((r) => setTimeout(r, 300));
            if (params.get("save") === "1") {
              await click("[data-action=ed-save]");
              await new Promise((r) => setTimeout(r, 1200));
            } else sheetRoot().querySelector(".sheet-body").scrollTop = 9999;
          }
        }
        if (open === "help-sheet" || open === "menu-about") {
          deepFind("controlz-view-menu").shadowRoot.querySelector("[data-toggle]").click();
          await new Promise((r) => setTimeout(r, 30));
          if (open === "help-sheet") {
            deepFind("controlz-view-menu").shadowRoot.querySelector("[data-help]").click();
            await new Promise((r) => setTimeout(r, 60));
            const section = params.get("section");
            if (section) sheetRoot().querySelector(`[data-action=help-go][data-id="${section}"]`)?.click();
          }
        }
        if (open === "security-settings") {
          deepFind("controlz-view-menu").shadowRoot.querySelector("[data-toggle]").click();
          await new Promise((r) => setTimeout(r, 30));
          deepFind("controlz-view-menu").shadowRoot.querySelector("[data-security]").click();
          await new Promise((r) => setTimeout(r, 60));
          if (params.get("mode")) sheetRoot().querySelector(`[data-action=sb-mode][data-mode="${params.get("mode")}"]`)?.click();
          await new Promise((r) => setTimeout(r, 30));
          for (const id of (params.get("rooms") || "").split(",").filter(Boolean)) {
            const box = sheetRoot().querySelector(`[data-action=sb-room][value="${id}"]`);
            if (!box) continue;
            box.checked = true;
            box.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
            await new Promise((r) => setTimeout(r, 30));
          }
        }
        if (open === "scene-sheet" || open === "export-sheet") {
          const chip = deepFind('.chip[data-entity="scene.office_focus"]') || deepFind(".chip[data-entity^='scene.']");
          chip.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, composed: true, cancelable: true }));
          await new Promise((r) => setTimeout(r, 400));
          if (open === "export-sheet") {
            sheetRoot().querySelector("[data-action=scene-export]").click();
            await new Promise((r) => setTimeout(r, 60));
          }
        }
        if (open === "import-sheet") {
          deepFind("[data-import]").click();
          await new Promise((r) => setTimeout(r, 60));
          await setField("[data-action=imp-text]", [
            "- name: Movie night", "  entities:", "    light.office_desk_lamp:", "      state: 'on'", "      brightness: 40",
            "    cover.office_roller_blind:", "      state: closed", "      current_position: 0",
            "- alias: Lights off at eleven", "  triggers:", "    - trigger: time", "      at: '23:00:00'",
            "  actions:", "    - action: light.turn_off", "      target:", "        area_id: office", "",
          ].join("\n"));
        }
        for (const sel of (params.get("click") || "").split(",").filter(Boolean)) {
          deepFind(sel)?.click();
          await new Promise((r) => setTimeout(r, 400));
        }
        if (params.get("probe")) {
          const prefix = params.get("probe");
          const pre = document.createElement("pre");
          pre.id = "probe";
          const api = mock.calls.filter((c) => c.domain === "api" && c.service.startsWith("POST")).map((c) => c.data);
          pre.textContent = JSON.stringify({
            states: Object.keys(mock.hass.states).filter((id) => id.startsWith(prefix)).map((id) => ({ id, area: mock.hass.entities[id]?.area_id ?? null })),
            saved: api,
            calls: mock.calls.filter((c) => !["api", "ws", "registry"].includes(c.domain)),
          });
          document.body.append(pre);
        }
        if (open.endsWith("-sheet") && !params.has("shot")) {
          await new Promise((r) => setTimeout(r, 50));
          const sheet = document.querySelector("controlz-sheet")?.shadowRoot.querySelector(".sheet");
          const body = document.querySelector("controlz-sheet")?.shadowRoot.querySelector(".sheet-body");
          const r = sheet?.getBoundingClientRect();
          const pre = document.createElement("pre");
          pre.id = "sheet-report";
          pre.textContent = JSON.stringify(r ? {
            viewport: [innerWidth, innerHeight],
            sheet: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)],
            fits: r.left >= 0 && r.top >= 0 && r.right <= innerWidth + 0.5 && r.bottom <= innerHeight + 0.5,
            bodyScrolls: body.scrollHeight > body.clientHeight + 1,
            footVisible: (() => { const f = sheet.querySelector(".sheet-foot").getBoundingClientRect(); return f.bottom <= innerHeight + 0.5; })(),
          } : { error: "no sheet" });
          document.body.append(pre);
        }
      }
      if (params.get("fit") !== "1") return;
      const report = await window.__fitReport();
      const pre = document.createElement("pre");
      pre.id = "fit-report";
      pre.textContent = JSON.stringify(report);
      document.body.append(pre);
      const errors = document.createElement("pre");
      errors.id = "errors";
      errors.textContent = JSON.stringify(window.__errors);
      document.body.append(errors);
    });
  </script>
</body>
</html>
